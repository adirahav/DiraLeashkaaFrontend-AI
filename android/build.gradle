// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.25'       // ADITEST
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.2'    // ADITEST
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"   // ADITEST
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    /*ADITEST*/
    configurations.configureEach {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
            force "com.google.android.gms:play-services-basement:18.2.0"
            force "com.google.android.gms:play-services-ads:22.6.0"
            force "com.google.android.ump:user-messaging-platform:2.2.0"
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
        }
    }
}

/*ADITEST*/
subprojects {
    afterEvaluate { project ->
        if (project.name == "capacitor-android") {

            project.android {
                lint {
                    abortOnError false
                    checkReleaseBuilds false
                }
            }

        }
    }
}
/**/

task clean(type: Delete) {
    delete rootProject.buildDir
}
