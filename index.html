<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>דירה להשקעה - מחשבון השקעות</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <!-- FOUC prevention: apply saved accessibility classes before React mounts -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('accessibility_settings') || 'null');
          if (s) {
            var b = document.body;
            if (s.fontSize === 'large')  b.classList.add('font-size-large');
            if (s.fontSize === 'xlarge') b.classList.add('font-size-xlarge');
            if (s.highContrast)   b.classList.add('high-contrast');
            if (s.grayscale)      b.classList.add('grayscale-mode');
            if (s.underlineLinks) b.classList.add('underline-links');
            if (s.readableFont)   b.classList.add('readable-font');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
